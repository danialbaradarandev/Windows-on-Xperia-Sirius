name: Build EDK2 UEFI for Galaxy Note 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # امکان اجرای دستی

jobs:
  build:
    runs-on: ubuntu-22.04 # رانر لینوکسی پیش‌فرض

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'  # برای دریافت ساب‌ماژول‌های EDK2

      - name: Install dependencies
        run: |
          # حذف مخازن مشکل‌دار Microsoft
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          
          # حذف PPA بازنشسته ondrej/php در صورت وجود
          sudo rm -f /etc/apt/sources.list.d/ondrej-ubuntu-php-*.sources /etc/apt/sources.list.d/ondrej-ubuntu-php-*.list
          
          # اجرای apt-get update با نادیده گرفتن خطاهای Release Info
          sudo apt-get update --allow-releaseinfo-change || true
          
          # نصب بسته‌های مورد نیاز
          sudo apt-get install -y git build-essential nasm uuid-dev iasl python3-distutils

      - name: Setup EDK2 environment
        run: |
          export WORKSPACE=$PWD
          export PACKAGES_PATH=$PWD
          export EDK_TOOLS_PATH=$PWD/BaseTools
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "PACKAGES_PATH=$PACKAGES_PATH" >> $GITHUB_ENV
          echo "EDK_TOOLS_PATH=$EDK_TOOLS_PATH" >> $GITHUB_ENV

      - name: Build BaseTools
        run: |
          make -C BaseTools/Source/C

      - name: Build UEFI firmware
        run: |
          source edksetup.sh
          build -a ARM -t GCC5 -p Galaxy-Note3-UEFI.dsc -b DEBUG

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UEFI-firmware
          path: Build/**/*.fd
